services:
  webcodex:
    # Explicit developer/source-build override for this audited fork.
    image: webcodex-server-local:${WEBCODEX_IMAGE_TAG:-security-hardened}
    pull_policy: build
    build:
      context: .
      dockerfile: Dockerfile
      args:
        WEBCODEX_GIT_COMMIT: ${WEBCODEX_GIT_COMMIT:-}
        WEBCODEX_GIT_DIRTY: ${WEBCODEX_GIT_DIRTY:-}
        WEBCODEX_BUILT_AT: ${WEBCODEX_BUILT_AT:-}
