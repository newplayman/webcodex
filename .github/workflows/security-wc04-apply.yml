name: Apply WC-04 shell environment hardening

on:
  push:
    branches:
      - security/harden-6b37efc

permissions:
  contents: write

jobs:
  apply-wc04:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-6b37efc
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply WC-04 patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('crates/webcodex-runner/src/webcodex_runner/shell.rs')
          text = path.read_text()

          old = '''fn should_inherit_env_key(key: &str) -> bool {
    // Windows command processors may add drive-current-directory pseudo
    // entries such as `=E:=E:\\\\git\\\\webcodex` to the native environment
    // block. They are not ordinary environment variables and cannot be
    // reconstructed through `Command::env`; detached execution carries its
    // working directory explicitly, so dropping them preserves the intended
    // child environment without weakening launch-envelope validation.
    !is_sensitive_env_key(key) && !(cfg!(windows) && key.starts_with('='))
}
'''
          new = '''fn should_inherit_env_key(key: &str) -> bool {
    // Windows command processors may add drive-current-directory pseudo
    // entries such as `=E:=E:\\\\git\\\\webcodex` to the native environment
    // block. They are not ordinary environment variables and cannot be
    // reconstructed through `Command::env`; detached execution carries its
    // working directory explicitly, so dropping them preserves the intended
    // child environment without weakening launch-envelope validation.
    !is_sensitive_env_key(key) && !(cfg!(windows) && key.starts_with('='))
}

// WC-04: raw/plain Runner execution must not accidentally inherit every
// credential present in the long-lived Runner service environment. Keep only
// the minimum OS/session baseline by default. Projects that deliberately need
// another parent variable can opt that exact name in through
// WEBCODEX_SHELL_INHERIT_ENV_ALLOWLIST, or (preferably) provide the credential
// through the existing explicit shell/profile env configuration.
const PLAIN_SHELL_BASELINE_ENV_KEYS: &[&str] = &[
    "PATH", "HOME", "USER", "LOGNAME", "SHELL", "LANG", "LANGUAGE", "TERM", "COLORTERM",
    "TMPDIR", "TMP", "TEMP", "TZ",
];

#[cfg(windows)]
const PLAIN_SHELL_WINDOWS_BASELINE_ENV_KEYS: &[&str] = &[
    "SystemRoot",
    "WINDIR",
    "ComSpec",
    "PATHEXT",
    "USERPROFILE",
    "HOMEDRIVE",
    "HOMEPATH",
    "APPDATA",
    "LOCALAPPDATA",
    "PROGRAMDATA",
];

fn baseline_plain_shell_parent_env_key(key: &str) -> bool {
    PLAIN_SHELL_BASELINE_ENV_KEYS
        .iter()
        .any(|allowed| env_keys_equal(allowed, key))
        || key.starts_with("LC_")
        || {
            #[cfg(windows)]
            {
                PLAIN_SHELL_WINDOWS_BASELINE_ENV_KEYS
                    .iter()
                    .any(|allowed| env_keys_equal(allowed, key))
            }
            #[cfg(not(windows))]
            {
                false
            }
        }
}

fn env_allowlist_contains(raw: &str, key: &str) -> bool {
    raw.split(',')
        .map(str::trim)
        .filter(|candidate| !candidate.is_empty())
        .any(|candidate| env_keys_equal(candidate, key))
}

fn operator_plain_shell_parent_env_key_allowed(key: &str) -> bool {
    std::env::var("WEBCODEX_SHELL_INHERIT_ENV_ALLOWLIST")
        .ok()
        .is_some_and(|raw| env_allowlist_contains(&raw, key))
}

fn should_inherit_plain_shell_parent_env_key(key: &str) -> bool {
    should_inherit_env_key(key)
        && (baseline_plain_shell_parent_env_key(key)
            || operator_plain_shell_parent_env_key_allowed(key))
}
'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one should_inherit_env_key block, found {text.count(old)}')
          text = text.replace(old, new, 1)

          old = '''fn apply_shell_environment(cmd: &mut Command, shell: &ShellConfig) -> Result<(), String> {
    // Rust's Windows env handling is case-insensitive (like the OS itself), so
    // removing the canonical spellings also removes mixed-case variants such
    // as `WebCodex_Token`.
    for key in SENSITIVE_ENV_KEYS {
        cmd.env_remove(key);
    }
    if !shell.path_prepend.is_empty() {
        let mut paths = shell.path_prepend.clone();
        if let Some(current) = std::env::var_os("PATH") {
            paths.extend(std::env::split_paths(&current));
        }
        let joined = std::env::join_paths(paths)
            .map_err(|e| format!("failed to build shell PATH from shell.path_prepend: {}", e))?;
        cmd.env("PATH", joined);
    }
    for (key, value) in &shell.env {
        if !is_sensitive_env_key(key) {
            cmd.env(key, value);
        }
    }
    Ok(())
}
'''
          new = '''fn apply_shell_environment(cmd: &mut Command, shell: &ShellConfig) -> Result<(), String> {
    let inherited = std::env::vars_os()
        .filter(|(key, _)| {
            key.to_str()
                .is_some_and(should_inherit_plain_shell_parent_env_key)
        })
        .collect::<Vec<_>>();
    let inherited_path = inherited
        .iter()
        .find(|(key, _)| {
            key.to_str()
                .is_some_and(|key| env_keys_equal(key, "PATH"))
        })
        .map(|(_, value)| value.clone());

    // Fail closed against ambient credentials: Command inherits its parent's
    // complete environment unless explicitly cleared. Start from the bounded
    // baseline above, then layer intentional Runner configuration on top.
    cmd.env_clear();
    for (key, value) in inherited {
        cmd.env(key, value);
    }
    if !shell.path_prepend.is_empty() {
        let mut paths = shell.path_prepend.clone();
        if let Some(current) = inherited_path.as_deref() {
            paths.extend(std::env::split_paths(current));
        }
        let joined = std::env::join_paths(paths)
            .map_err(|e| format!("failed to build shell PATH from shell.path_prepend: {}", e))?;
        cmd.env("PATH", joined);
    }
    // Explicit operator/project configuration remains authoritative. This is
    // the supported path for a project that genuinely needs an exchange key,
    // RPC credential, wallet signer endpoint, CUDA knob, proxy, etc. WebCodex's
    // own transport/admin credentials remain non-injectable.
    for (key, value) in &shell.env {
        if !is_sensitive_env_key(key) {
            cmd.env(key, value);
        }
    }
    Ok(())
}
'''
          if text.count(old) != 1:
