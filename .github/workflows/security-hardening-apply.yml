name: Apply audited security hardening

on:
  push:
    branches:
      - security/harden-6b37efc

permissions:
  contents: write

jobs:
  harden:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/harden-6b37efc
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply security patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              write(path, text.replace(old, new, 1))

          def regex_once(path, pattern, replacement):
              text = read(path)
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.S | re.M)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected exactly one match, found {count}")
              write(path, new)

          # WC-01: fail closed when the bootstrap/admin token is missing.
          lib = "src/lib.rs"
          replace_once(
              lib,
              "pub async fn run_server() -> Result<(), Box<dyn std::error::Error>> {\n",
              "fn server_auth_start_allowed(auth_enabled: bool, explicit_unsafe_override: bool) -> bool {\n"
              "    auth_enabled || explicit_unsafe_override\n"
              "}\n\n"
              "pub async fn run_server() -> Result<(), Box<dyn std::error::Error>> {\n",
          )
          replace_once(
              lib,
              "    let config = Config::from_env();\n"
              "    let (acceptor, listener_mode, listener_addr) = server_listener::server_acceptor(&config.addr)\n"
              "        .await\n"
              "        .map_err(std::io::Error::other)?;\n",
              "    let config = Config::from_env();\n"
              "    let allow_unauthenticated_bootstrap =\n"
              "        config::env_flag(\"WEBCODEX_ALLOW_UNAUTHENTICATED_BOOTSTRAP\").unwrap_or(false);\n"
              "    if !server_auth_start_allowed(config.is_auth_enabled(), allow_unauthenticated_bootstrap) {\n"
              "        return Err(std::io::Error::new(\n"
              "            std::io::ErrorKind::PermissionDenied,\n"
              "            \"WEBCODEX_TOKEN is required; refusing unauthenticated bootstrap access. Set WEBCODEX_ALLOW_UNAUTHENTICATED_BOOTSTRAP=true only for an explicitly trusted local development environment.\",\n"
              "        )\n"
              "        .into());\n"
              "    }\n"
              "    let (acceptor, listener_mode, listener_addr) = server_listener::server_acceptor(&config.addr)\n"
              "        .await\n"
              "        .map_err(std::io::Error::other)?;\n",
          )
          with Path(lib).open("a") as f:
              f.write(r'''

#[cfg(test)]
mod security_hardening_auth_tests {
    use super::server_auth_start_allowed;

    #[test]
    fn unauthenticated_bootstrap_requires_explicit_override() {
        assert!(!server_auth_start_allowed(false, false));
        assert!(server_auth_start_allowed(true, false));
        assert!(server_auth_start_allowed(false, true));
    }
