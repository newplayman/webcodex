      - name: Run Runner tests
        run: cargo test --locked -p webcodex-runner

      - name: Verify formatting
        run: cargo fmt --all -- --check

      - name: Commit hardened source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/security-hardening-apply.yml
          git config user.name "webcodex-security-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "security: harden auth, file reads, shell env, and image pinning"
          git push origin HEAD:security/harden-6b37efc
