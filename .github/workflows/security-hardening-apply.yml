''')

          # WC-02: canonicalize the real read target, re-check the secret policy
          # against that canonical project-relative target, and read the canonical
          # path rather than the attacker-controlled symlink name.
          files = "crates/webcodex-runner/src/webcodex_runner/files.rs"
          regex_once(
              files,
              r"fn handle_file_read_request\(\n.*?\n\}\n\n#\[derive\(Serialize\)\]",
              r'''fn handle_file_read_request(
    policy: &RunnerPolicy,
    request: &RunnerRequest,
    resolved: &Path,
    start: Instant,
) -> CommandResult {
    let target = match canonical_file_read_target_in_project(request, resolved) {
        Ok(target) => target,
        Err(reason) => {
            return CommandResult {
                exit_code: None,
                stdout: None,
                stderr: None,
                duration_ms: Some(start.elapsed().as_millis() as u64),
                error: Some(read_file_reason_message(reason)),
            }
        }
    };
    // The transport cap (`max_bytes`) is clamped to the shared content budget so
    // the runner never emits a range the server's model output limit cannot
    // hold. The server always sends an explicit `start_line`/`end_line` for
    // `read_file`, so this branch returns the canonical v1 envelope.
    let max = request
        .max_bytes
        .unwrap_or(DEFAULT_MAX_OUTPUT_BYTES)
        .min(policy.max_output_bytes);
    if let (Some(start_line), Some(end_line)) = (request.start_line, request.end_line) {
        return handle_file_read_range_request(&target, start_line, end_line, max, start);
    }

    // Legacy non-range path: read the whole canonical file under the transport
    // cap. Reading the canonical target, rather than the original alias, closes
    // the symlink-name swap that previously bypassed sensitive-path checks.
    match std::fs::read(&target) {
        Ok(bytes) => {
            if bytes.len() > max {
                CommandResult {
                    exit_code: None,
                    stdout: None,
                    stderr: None,
                    duration_ms: Some(start.elapsed().as_millis() as u64),
                    error: Some(format!(
                        "file too large: {} bytes exceeds max_bytes {}",
                        bytes.len(),
                        max
                    )),
                }
            } else {
                CommandResult {
                    exit_code: Some(0),
                    stdout: Some(String::from_utf8_lossy(&bytes).to_string()),
                    stderr: Some(String::new()),
                    duration_ms: Some(start.elapsed().as_millis() as u64),
                    error: None,
                }
            }
        }
        Err(e) => CommandResult {
            exit_code: None,
            stdout: None,
            stderr: None,
            duration_ms: Some(start.elapsed().as_millis() as u64),
            error: Some(file_read_error_message(&e)),
        },
    }
}

#[derive(Serialize)]''',
          )
          regex_once(
              files,
              r"fn ensure_file_read_target_in_project\(\n.*?^\}\n",
              r'''fn canonical_file_read_target_in_project(
    request: &RunnerRequest,
    resolved: &Path,
) -> Result<PathBuf, ReadFileReason> {
    let project_root = request.cwd.as_deref().ok_or(ReadFileReason::InvalidPath)?;
    let project_root = Path::new(project_root)
        .canonicalize()
        .map_err(|error| read_file_reason_from_io(&error))?;
    let target = resolved
        .canonicalize()
        .map_err(|error| read_file_reason_from_io(&error))?;
    if !target.starts_with(&project_root) {
        return Err(ReadFileReason::InvalidPath);
    }
    let relative = target
        .strip_prefix(&project_root)
        .map_err(|_| ReadFileReason::InvalidPath)?;
    let relative = relative.to_string_lossy().replace('\\', "/");
    if webcodex_core::sensitive_paths::is_secret_path(&relative) {
        return Err(ReadFileReason::SensitivePath);
    }
    if !target.is_file() {
        return Err(ReadFileReason::NotFile);
    }
    Ok(target)
}
''',
          )
          with Path(files).open("a") as f:
