          Path("SECURITY_HARDENING.md").write_text(r'''# Security hardening for the audited fork

This branch hardens the source snapshot rooted at upstream commit
`6b37efc64b81a1e09a7a4d7b83f754f4860429b2` without removing file editing,
Git, shell, Jobs, Python, or other normal WebCodex execution capabilities.

## Security changes

1. **Authentication fails closed.** A Server without `WEBCODEX_TOKEN` now refuses
   to start. The old unauthenticated bootstrap/admin behavior is available only
   through the explicit local-development escape hatch
   `WEBCODEX_ALLOW_UNAUTHENTICATED_BOOTSTRAP=true`.
2. **Canonical read targets are re-checked.** Runner file reads canonicalize the
   actual target, verify it remains inside the registered project, re-apply the
   sensitive-path policy to the canonical project-relative path, and then read
   the canonical target. A harmless-looking symlink can no longer alias `.env`,
   `*.key`, `*.pem`, Runner credentials, or other protected names.
3. **Raw shell ambient secrets are not inherited.** Plain/raw shell execution
   starts from a small OS environment baseline instead of inheriting the entire
   Runner service environment. Extra variables can be deliberately inherited by
   name using `WEBCODEX_SHELL_INHERIT_ENV_ALLOWLIST`, or supplied through the
   existing per-project shell/profile `env` configuration. WebCodex's own
   transport credentials remain non-inheritable.
4. **Deployment does not follow upstream `latest`.** The default Compose file
   uses a local-only hardened image with `pull_policy: never`. Build this exact
   checkout using `compose.build.yaml`, or explicitly configure an audited image.

## Credential-bearing projects

The changes above prevent accidental ambient credential exposure. They do not
pretend that arbitrary shell execution and unrestricted access to a credential
are logically separable: if a project intentionally injects a private key into
its execution environment, code authorized to run in that environment can use
that key. Prefer narrowly scoped project-specific credentials and do not expose
Server/Runner bootstrap credentials to project processes.

`WEBCODEX_TOOL_REQUEST_TRACE=full` intentionally stores semantic tool payloads
and may therefore retain secrets that appear in command output or tool results.
Leave full tracing disabled during credential-bearing operation unless that
retention is explicitly required and protected.
''')
          PY

