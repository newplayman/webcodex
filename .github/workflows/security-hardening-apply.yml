#[cfg(all(test, unix))]
mod security_hardening_file_read_tests {
    use super::*;
    use std::os::unix::fs::symlink;
    use std::time::{SystemTime, UNIX_EPOCH};

    fn temp_root() -> PathBuf {
        let nonce = SystemTime::now()
            .duration_since(UNIX_EPOCH)
            .unwrap()
            .as_nanos();
        std::env::temp_dir().join(format!(
            "webcodex-security-read-{}-{nonce}",
            std::process::id()
        ))
    }

    #[test]
    fn canonical_read_target_blocks_symlink_alias_to_secret_file() {
        let root = temp_root();
        std::fs::create_dir_all(&root).unwrap();
        std::fs::write(root.join(".env"), b"FAKE_SECRET=not-real\n").unwrap();
        std::fs::write(root.join("normal.txt"), b"ok\n").unwrap();
        symlink(".env", root.join("settings.txt")).unwrap();
        symlink("normal.txt", root.join("normal-link.txt")).unwrap();

        let secret_alias = root.join("settings.txt");
        let relative_secret = secret_alias.canonicalize().unwrap();
        let relative_secret = relative_secret.strip_prefix(root.canonicalize().unwrap()).unwrap();
        assert!(webcodex_core::sensitive_paths::is_secret_path(
            &relative_secret.to_string_lossy()
        ));

        let normal = root.join("normal-link.txt").canonicalize().unwrap();
        assert!(normal.ends_with("normal.txt"));
        std::fs::remove_dir_all(&root).unwrap();
    }
}
''')

          # WC-04: plain/raw shell no longer inherits the entire Runner parent
          # environment. Preserve a small non-secret OS baseline; additional
          # variables can be deliberately opted in by name or supplied through
          # the existing shell/profile env configuration.
          shell = "crates/webcodex-runner/src/webcodex_runner/shell.rs"
          regex_once(
              shell,
              r"fn apply_shell_environment\(cmd: &mut Command, shell: &ShellConfig\) -> Result<\(\), String> \{\n.*?^\}\n\nfn apply_env_snapshot",
              r'''const PLAIN_SHELL_BASELINE_ENV_KEYS: &[&str] = &[
    "PATH", "HOME", "USER", "LOGNAME", "LANG", "LC_ALL", "LC_CTYPE", "TERM", "TMPDIR", "TZ",
];

#[cfg(windows)]
const PLAIN_SHELL_WINDOWS_ENV_KEYS: &[&str] = &[
    "SystemRoot",
    "WINDIR",
    "ComSpec",
    "PATHEXT",
    "TEMP",
    "TMP",
    "USERPROFILE",
    "APPDATA",
    "LOCALAPPDATA",
    "PROGRAMDATA",
];

fn baseline_plain_shell_env_key(key: &str) -> bool {
    PLAIN_SHELL_BASELINE_ENV_KEYS
        .iter()
        .any(|allowed| env_keys_equal(allowed, key))
        || key.starts_with("LC_")
        || {
            #[cfg(windows)]
            {
                PLAIN_SHELL_WINDOWS_ENV_KEYS
                    .iter()
                    .any(|allowed| env_keys_equal(allowed, key))
            }
            #[cfg(not(windows))]
            {
                false
            }
        }
}

fn operator_plain_shell_env_key_allowed(key: &str) -> bool {
    std::env::var("WEBCODEX_SHELL_INHERIT_ENV_ALLOWLIST")
        .ok()
        .is_some_and(|raw| {
            raw.split(',')
                .map(str::trim)
                .filter(|candidate| !candidate.is_empty())
                .any(|candidate| env_keys_equal(candidate, key))
        })
}

fn plain_shell_env_key_allowed(key: &str) -> bool {
    !is_sensitive_env_key(key)
        && (baseline_plain_shell_env_key(key) || operator_plain_shell_env_key_allowed(key))
}

fn apply_shell_environment(cmd: &mut Command, shell: &ShellConfig) -> Result<(), String> {
    let inherited = std::env::vars_os()
        .filter(|(key, _)| {
            key.to_str()
                .is_some_and(plain_shell_env_key_allowed)
        })
        .collect::<Vec<_>>();
    let inherited_path = inherited
        .iter()
        .find(|(key, _)| key.to_str().is_some_and(|key| env_keys_equal(key, "PATH")))
        .map(|(_, value)| value.clone());

    // A raw shell previously inherited every parent variable except four
    // WebCodex-specific names. Clear first so unrelated wallet/exchange/cloud
    // credentials cannot leak into child processes merely because the Runner
    // service happened to inherit them.
    cmd.env_clear();
    for (key, value) in inherited {
        cmd.env(key, value);
    }

    if !shell.path_prepend.is_empty() {
        let mut paths = shell.path_prepend.clone();
        if let Some(current) = inherited_path.as_deref() {
            paths.extend(std::env::split_paths(current));
        }
        let joined = std::env::join_paths(paths)
            .map_err(|e| format!("failed to build shell PATH from shell.path_prepend: {}", e))?;
        cmd.env("PATH", joined);
    }
    // Explicit operator configuration remains authoritative. This preserves
    // full functionality for projects that deliberately need an API key or
    // other variable while preventing accidental ambient inheritance.
    for (key, value) in &shell.env {
        if !is_sensitive_env_key(key) {
            cmd.env(key, value);
        }
    }
    Ok(())
}

fn apply_env_snapshot''',
